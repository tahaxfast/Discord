<script>
const gun = Gun([
  'https://gun-manhattan.herokuapp.com/gun',
  'https://gun-us.herokuapp.com/gun'
]);
const user = gun.user();
let isRegisterMode = true;
let currentChannel = 'عمومی';
let currentProfileUser = null;
let renderedIds = new Set();
const BLUE_TICK = 'https://cdn.imgurl.ir/uploads/n758648_ChatGPT_Image_Sep_11_2026_04_50_08_PM.png';

function toggleAuth() {
  isRegisterMode = !isRegisterMode;
  document.getElementById('authTitle').textContent = isRegisterMode ? 'ساخت حساب جدید' : 'خوش اومدی!';
  document.getElementById('authSub').textContent = isRegisterMode ? 'با GunDB SEA امن ثبت‌نام کن' : 'وارد حساب GunDB خودت شو';
  document.getElementById('authBtn').textContent = isRegisterMode ? 'ثبت‌نام' : 'ورود';
  document.getElementById('switchText').textContent = isRegisterMode ? 'حساب داری؟ ' : 'حساب نداری؟ ';
  document.getElementById('switchLink').textContent = isRegisterMode ? 'ورود' : 'ثبت‌نام';
}

function handleAuth() {
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value.trim();
  const status = document.getElementById('status');
  const btn = document.getElementById('authBtn');
  if (!username || !password) return status.textContent = '⚠️ نام کاربری و رمز رو وارد کن!';
  if (password.length < 6) return status.textContent = '⚠️ رمز باید حداقل ۶ حرف باشه!';
  btn.disabled = true;
  status.textContent = '⏳ در حال پردازش...';
  if (isRegisterMode) {
    user.create(username, password, (ack) => {
      btn.disabled = false;
      if (ack.err) return status.textContent = '❌ ' + ack.err;
      status.textContent = '✅ ثبت‌نام موفق!';
      user.auth(username, password, (a) => {
        if (!a.err) {
          gun.get('profiles').get(username).put({ role: 'عضو', bio: '', color: '#fff', bg: '#36393f', suspended: false });
          checkOwnerAndChat(username);
        }
      });
    });
  } else {
    user.auth(username, password, (ack) => {
      btn.disabled = false;
      if (ack.err) return status.textContent = '❌ ' + ack.err;
      checkSuspended(username).then(s => {
        if (s) { user.leave(); return status.textContent = '⛔ اکانت شما تعلیق شده!'; }
        checkOwnerAndChat(username);
      });
    });
  }
}

function checkOwnerAndChat(username) {
  gun.get('owner').once((data) => {
    if (!data || !data.name) {
      gun.get('owner').put({ name: username });
      gun.get('profiles').get(username).put({ role: 'اونر' });
    }
    showChat();
  });
}

function checkSuspended(username) {
  return new Promise((resolve) => {
    gun.get('profiles').get(username).once((data) => resolve(data?.suspended || false));
  });
}

function showChat() {
  document.getElementById('authPage').style.display = 'none';
  document.getElementById('chatPage').style.display = 'block';
  loadChannels(); loadMessages(); loadUsers(); loadBackground(); renderAdminPanel(); checkVerifyPermission(); setOnline(true);
  gun.get('public-chat').map().on((msg) => {
    if (!msg || !msg.text) return;
    if (msg.channel !== currentChannel) return;
    renderMessage(msg);
  });
  gun.get('online-users').map().on(() => renderUserList());
}

function loadChannels() {
  const list = document.getElementById('channelList');
  list.innerHTML = '<div class="channel active" data-name="عمومی" onclick="switchChannel(this, \'عمومی\')"><span>عمومی</span></div>';
  gun.get('channels').map().on((ch, id) => {
    if (!ch || !ch.name) return;
    const exists = document.querySelector(`.channel[data-name="${ch.name}"]`);
    if (exists) {
      const tick = exists.querySelector('.channel-tick');
      if (ch.verified && !tick) {
        const img = document.createElement('img'); img.src = BLUE_TICK; img.className = 'channel-tick'; exists.appendChild(img);
      } else if (!ch.verified && tick) tick.remove();
      return;
    }
    const div = document.createElement('div');
    div.className = 'channel'; div.dataset.name = ch.name;
    if (ch.verified) { const img = document.createElement('img'); img.src = BLUE_TICK; img.className = 'channel-tick'; div.appendChild(img); }
    const span = document.createElement('span'); span.textContent = ch.name; div.appendChild(span);
    div.onclick = () => switchChannel(div, ch.name);
    list.appendChild(div);
  });
}

function switchChannel(el, name) {
  document.querySelectorAll('.channel').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  currentChannel = name;
  document.getElementById('channelTitle').textContent = name;
  document.getElementById('messages').innerHTML = '';
  renderedIds.clear();
  loadMessages(); checkVerifyPermission();
}

function openCreateChannel() { document.getElementById('createChannelModal').classList.add('open'); }
function closeCreateChannel(e) { if (e && e.target !== e.currentTarget && e.type === 'click') return; document.getElementById('createChannelModal').classList.remove('open'); }
function createChannel() {
  const name = document.getElementById('newChannelName').value.trim();
  if (!name) return alert('اسم کانال رو بنویس!');
  gun.get('channels').set({ name, creator: user.is.alias, time: Date.now(), verified: false });
  document.getElementById('newChannelName').value = '';
  closeCreateChannel();
}

function checkVerifyPermission() {
  isOwner((owner) => {
    const btn = document.getElementById('verifyBtn');
    btn.style.display = owner ? 'block' : 'none';
    gun.get('channels').map().once((ch) => { if (ch && ch.name === currentChannel) btn.classList.toggle('active', ch.verified); });
  });
}

function toggleChannelVerify() {
  gun.get('channels').map().once((ch, id) => {
    if (ch && ch.name === currentChannel) {
      gun.get('channels').get(id).put({ verified: !ch.verified });
      checkVerifyPermission();
    }
  });
}

function insertFormat(marker) {
  const input = document.getElementById('msgInput');
  const start = input.selectionStart, end = input.selectionEnd;
  const text = input.value;
  input.value = text.slice(0, start) + marker + text.slice(start, end) + marker + text.slice(end);
  input.focus();
  input.selectionStart = input.selectionEnd = end + marker.length * 2;
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  gun.get('public-chat').set({ user: user.is.alias || 'ناشناس', text, time: Date.now(), channel: currentChannel });
  input.value = '';
}

function renderMessage(msg) {
  const box = document.getElementById('messages');
  const key = msg.time + '_' + msg.user;
  if (renderedIds.has(key)) return;
  renderedIds.add(key);
  gun.get('profiles').get(msg.user).once((data) => {
    const color = data?.color || '#fff';
    const div = document.createElement('div');
    div.className = 'message';
    div.innerHTML = `
      <div class="avatar" onclick="openProfile('${msg.user}')">${msg.user[0].toUpperCase()}</div>
      <div class="msg-content">
        <div class="msg-header">
          <span class="username" style="color:${color}" onclick="openProfile('${msg.user}')">${msg.user}</span>
          <span class="timestamp">${new Date(msg.time).toLocaleTimeString('fa-IR')}</span>
        </div>
        <div class="msg-text">${formatText(msg.text)}</div>
      </div>`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  });
}

function formatText(text) {
  let t = escapeHtml(text);
  t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  t = t.replace(/\*(.+?)\*/g, '<i>$1</i>');
  t = t.replace(/\|\|(.+?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'show\')">$1</span>');
  return t;
}

function loadMessages() { document.getElementById('messages').innerHTML = ''; renderedIds.clear(); }

function setOnline(status) {
  const me = user.is.alias;
  if (!me) return;
  gun.get('online-users').get(me).put({ name: me, online: status, time: Date.now() });
}

function loadUsers() { gun.get('online-users').map().on(() => renderUserList()); }

function renderUserList() {
  const list = document.getElementById('userList');
  const users = [];
  gun.get('online-users').map().once((u) => { if (u && u.name && !users.find(x => x.name === u.name)) users.push(u); });
  setTimeout(() => {
    const online = users.filter(u => u.online);
    document.getElementById('onlineCount').textContent = online.length;
    document.getElementById('onlineHeader').textContent = `🟢 ${online.length} آنلاین`;
    list.innerHTML = '';
    users.forEach(u => {
      gun.get('profiles').get(u.name).once((p) => {
        const role = p?.role || 'عضو';
        let tag = '';
        if (role === 'اونر') tag = '<span class="tag tag-owner">👑</span>';
        else if (role === 'ادمین') tag = '<span class="tag tag-admin">🛡️</span>';
        const item = document.createElement('div');
        item.className = 'user-item';
        item.onclick = () => openProfile(u.name);
        item.innerHTML = `<div class="status ${u.online ? '' : 'offline'}"></div><span style="color:${p?.color || '#b9bbbe'}">${u.name}</span>${tag}`;
        list.appendChild(item);
      });
    });
  }, 500);
}

function isOwner(callback) { gun.get('owner').once((data) => callback(data && data.name === user.is.alias)); }

function renderAdminPanel() {
  isOwner((owner) => {
    if (!owner) { document.getElementById('adminPanel').style.display = 'none'; return; }
    document.getElementById('adminPanel').style.display = 'block';
    const list = document.getElementById('adminList');
    list.innerHTML = '';
    gun.get('profiles').map().once((data, username) => {
      if (!data || !username) return;
      const role = data.role || 'عضو';
      const row = document.createElement('div');
      row.className = 'admin-row';
      row.innerHTML = `
        <span>${username}</span>
        <select onchange="setRole('${username}', this.value)">
          <option value="عضو" ${role === 'عضو' ? 'selected' : ''}>عضو</option>
          <option value="ادمین" ${role === 'ادمین' ? 'selected' : ''}>ادمین</option>
          <option value="اونر" ${role === 'اونر' ? 'selected' : ''}>اونر</option>
        </select>
        <button class="del-btn" onclick="suspendUser('${username}')">⛔</button>`;
      list.appendChild(row);
    });
  });
}

function setRole(username, role) { isOwner((o) => { if (!o) return alert('فقط اونر!'); gun.get('profiles').get(username).put({ role }); }); }
function suspendUser(username) {
  isOwner((o) => {
    if (!o) return alert('فقط اونر!');
    gun.get('profiles').get(username).once((d) => {
      gun.get('profiles').get(username).put({ suspended: !d?.suspended });
      alert((!d?.suspended) ? '⛔ تعلیق شد' : '✅ آزاد شد');
    });
  });
}

function openProfile(username) {
  currentProfileUser = username;
  document.getElementById('profileAvatar').textContent = username[0].toUpperCase();
  gun.get('profiles').get(username).once((data) => {
    document.getElementById('profileName').textContent = username;
    document.getElementById('profileName').style.color = data?.color || '#fff';
    document.getElementById('profileRole').textContent = data?.role || 'عضو';
    document.getElementById('profileBio').textContent = data?.bio || 'بیو نداره';
  });
  document.getElementById('profileModal').classList.add('open');
}
function closeProfile(e) { if (e && e.target !== e.currentTarget && e.type === 'click') return; document.getElementById('profileModal').classList.remove('open'); }
function openSettings() {
  if (!currentProfileUser) return;
  gun.get('profiles').get(currentProfileUser).once((d) => {
    document.getElementById('bioInput').value = d?.bio || '';
    document.getElementById('colorSelect').value = d?.color || '#fff';
    document.getElementById('bgSelect').value = d?.bg || '#36393f';
  });
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(e) { if (e && e.target !== e.currentTarget && e.type === 'click') return; document.getElementById('settingsModal').classList.remove('open'); }
function saveProfile() {
  const bio = document.getElementById('bioInput').value.trim();
  const color = document.getElementById('colorSelect').value;
  const bg = document.getElementById('bgSelect').value;
  gun.get('profiles').get(user.is.alias).put({ bio, color, bg });
  document.getElementById('chatArea').style.background = bg;
  alert('✅ ذخیره شد!');
  closeSettings();
}
function loadBackground() {
  gun.get('profiles').get(user.is.alias).once((d) => { if (d?.bg) document.getElementById('chatArea').style.background = d.bg; });
}
function deleteAccount() {
  if (!confirm('مطمئنی می‌خوای اکانتت حذف شه؟')) return;
  gun.get('profiles').get(user.is.alias).put({ suspended: true, deleted: true });
  user.leave();
  location.reload();
}

function logout() { setOnline(false); user.leave(); location.reload(); }
function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

user.recall({ sessionStorage: true }, () => { if (user.is) showChat(); });
</script>
</body>
</html>
